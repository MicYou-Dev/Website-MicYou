name: Update GitHub Data

on:
  schedule:
    # 每 6 小时运行一次
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fetch-gh-data.ts"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch GitHub data
        run: bun run fetch:ghdata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes
        id: check
        run: |
          git diff --exit-code src/public/ghdata.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/public/ghdata.json
          git commit -m "chore: update GitHub data"
          git push